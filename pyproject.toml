[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience"
version = "1.0.0"
description = "Locomotor resilience pipeline for sand walking in older adults"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Victor Salvat", email = "victor.salvat@etu.umontpellier.fr" },
]
keywords = ["biomechanics", "gait analysis", "resilience", "TDE", "EMD"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "h5py>=3.9",
    "EMD-signal>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["resilience*"]
